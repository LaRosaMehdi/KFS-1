set timeout=-1
set timeout_style=menu
set default=0
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

insmod multiboot
insmod reboot
insmod halt

menuentry "Start KFS-1" {
    multiboot /boot/kfs.bin
    boot
}

menuentry "Reboot" {
    reboot
}

menuentry "Halt" {
    halt
}
