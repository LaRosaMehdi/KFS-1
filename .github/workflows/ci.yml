name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib \
            nasm \
            make \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            python3
          sudo apt-get install -y qemu-system-x86
          command -v qemu-system-i386 || command -v qemu-system-x86_64

      - name: Build and test mandatory
        run: make test

      - name: Build and test bonus
        run: make -C bonus test
